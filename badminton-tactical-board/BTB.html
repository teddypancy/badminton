<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>羽球戰術板 v0.2</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ===== 頂部導航欄 ===== -->
<header id="topbar">
  <div class="logo">🏸 羽球戰術板</div>
  <div class="topbar-left">
    <button class="btn btn-outline" id="btn-toggle-tb">🎮 3D控制台</button>
    <button class="btn btn-outline" id="btn-drawer">📐 2D戰術板</button>
  </div>
  <div class="topbar-right">
    <button class="btn btn-outline" id="btn-scripts">📁 腳本管理</button>
    <button class="btn btn-outline" id="btn-log">📋 載入中...</button>
    <span id="hud">📊 共 0 拍</span>
  </div>
</header>

<!-- ===== 3D 場景容器 ===== -->
<div id="container3d"></div>

<!-- ===== 3D 控制台（默認收起） ===== -->
<div id="integrated-toolbar" class="hidden">
  <div class="tb-row">
    <button class="btn tb-btn" id="btn-play">▶ 播放</button>
    <button class="btn tb-btn" id="btn-stop">⏹ 停止</button>
    <button class="btn tb-btn" id="btn-step">⏭ 單拍</button>
  </div>
  <div class="tb-row">
    <span class="row-label">進度</span>
    <input type="range" id="timeline" min="0" max="100" value="0" step="0.1">
  </div>
  <div class="tb-row">
    <span class="row-label">速度</span>
    <div class="tb-btn-group">
      <button class="btn speed-btn" data-speed="0.2">0.2x</button>
      <button class="btn speed-btn" data-speed="0.5">0.5x</button>
      <button class="btn speed-btn active" data-speed="1">1x</button>
      <button class="btn speed-btn" data-speed="1.5">1.5x</button>
      <button class="btn speed-btn" data-speed="2">2x</button>
    </div>
  </div>
  <div class="tb-row">
    <span class="row-label">視角</span>
    <div class="tb-btn-group">
      <button class="btn view-btn" data-view="top">俯瞰</button>
      <button class="btn view-btn" data-view="high">高位</button>
      <button class="btn view-btn" data-view="low">低位</button>
      <button class="btn view-btn" data-view="side">側視</button>
      <button class="btn view-btn active" data-view="45">45°</button>
    </div>
  </div>
</div>

<!-- ===== 2D 戰術板抽屜 ===== -->
<div id="drawer2d">
  <!-- 左側：標題列 + 球場 -->
  <div class="drawer-left-column">
    <div id="drawer-header">
      <div class="mode-toggle">
        <button class="mode-btn active" data-appmode="smart">📋 腳本</button>
        <button class="mode-btn" data-appmode="free">✏️ 手繪</button>
      </div>
      <div class="divider"></div>
      <div class="shot-controls">
        <button class="btn icon-btn" id="btn-shot-prev">◀</button>
        <span class="shot-counter" id="shot-info-text">0 / 0</span>
        <button class="btn icon-btn" id="btn-shot-next">▶</button>
        <button class="btn btn-success btn-sm" id="btn-add">＋ 新增</button>
        <button class="btn btn-danger btn-sm" id="btn-del">✕ 刪除</button>
        <button class="btn btn-primary btn-sm" id="btn-save">💾 保存</button>
      </div>
      <div class="right-tools">
        <div id="free-draw-toolbar">
          <button class="btn tool-btn" data-tool="select">👆</button>
          <button class="btn tool-btn active" data-tool="pencil">✏️</button>
          <div class="divider-sm"></div>
          <div id="color-picker-list"></div>
          <div class="divider-sm"></div>
          <button class="btn tool-btn" data-tool="eraser">🧹</button>
          <button class="btn tool-btn" id="btn-undo-draw">↩</button>
          <button class="btn btn-danger btn-sm" id="btn-clear-draw">清空</button>
        </div>
      </div>
    </div>

    <div id="court-wrap">
      <canvas id="court2d"></canvas>
      <div id="mini-selector-popup">
        <div id="mini-popup-title">選擇重疊物件</div>
        <div id="mini-popup-options"></div>
      </div>
    </div>
  </div>

  <!-- 分割條 -->
  <div id="resizer-v"></div>

  <!-- 右側：參數區 -->
  <div id="panel-wrap">
    <div class="panel-section" id="side-arc-section">
      <h4>📐 側視軌跡</h4>
      <canvas id="sideArcCanvas"></canvas>
    </div>
    <div class="panel-section" id="param-section">
      <div id="param-content"><div class="loading-text">載入中...</div></div>
    </div>
    <div class="panel-section" id="diagnostic-section">
      <h4>⚡ 物理診斷</h4>
      <div id="diagnostic-content"><div class="loading-text">載入中...</div></div>
    </div>
  </div>
</div>

<!-- ===== Toast 提示 ===== -->
<div id="toast"></div>

<!-- ===== 日誌面板（右上角下拉） ===== -->
<div id="log-panel" class="dropdown-panel" style="display:none;">
  <div class="dropdown-header">
    <span id="log-title">📋 回合日誌</span>
    <button class="btn btn-close" id="btn-log-close">✕</button>
  </div>
  <div class="dropdown-body" id="log-list"></div>
</div>

<!-- ===== 腳本管理面板（右上角下拉） ===== -->
<div id="scripts-panel" class="dropdown-panel" style="display:none;">
  <div class="dropdown-header">
    <span>📁 腳本管理</span>
    <div class="dropdown-header-actions">
      <button class="btn btn-outline btn-sm" id="btn-import-all">📥 導入</button>
      <button class="btn btn-outline btn-sm" id="btn-export-all">📤 導出</button>
      <button class="btn btn-success btn-sm" id="btn-new-script">＋ 新增</button>
    </div>
    <input type="file" id="file-import" accept=".json" style="display:none;">
  </div>
  <div class="dropdown-body" id="scripts-list"></div>
</div>

<!-- ===== 新增腳本類型選擇彈窗 ===== -->
<div id="script-type-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <span>選擇腳本類型</span>
      <button class="btn btn-close" id="btn-modal-close">✕</button>
    </div>
    <div class="modal-body grid-2">
      <button class="type-btn" data-type="singles">🏸 單打</button>
      <button class="type-btn" data-type="doubles">🏸 雙打</button>
      <button class="type-btn" data-type="2v1">🏸 2-1式</button>
      <button class="type-btn" data-type="3v1">🏸 3-1式</button>
    </div>
  </div>
</div>

<!-- ===== 3D 渲染庫 ===== -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
  }
}
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
